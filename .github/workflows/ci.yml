name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm -r typecheck

      # The desktop suite is pure Node: it needs no agent binary.
      - name: Test the desktop app
        run: pnpm --filter @gentle-shell/desktop test

      # The bridge suite starts a real `pi --mode rpc` child and loads the gentle-pi harness (see
      # docs/architecture.md, "Starting the agent correctly"). Provisioning that harness on a runner is
      # its own decision, so until then the suite runs where the harness exists and says out loud when
      # it did not run — a skipped suite must never look like a passing one.
      - name: Test the bridge (needs the Pi harness)
        run: |
          if command -v pi >/dev/null 2>&1; then
            pnpm --filter @gentle-shell/bridge test
          else
            echo "::notice::pi is not on this runner, so the bridge suite was skipped; it runs locally."
          fi
